<script>try{var t=localStorage.getItem("et-theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}catch(e){}</script>

</head>

<div id="app"></div>

<!-- Слой 2 — движки правил: физика/визуализация кубиков, кубики, экипировка, механики. -->

<script src="/static/equipment.js"></script>
<script src="/static/mechanics.js"></script>
