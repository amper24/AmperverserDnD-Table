[package]
name = "dnd-table"
version = "0.5.8"
edition = "2021"
description = "Amperverser DnD Table — виртуальный стол для D&D"
license = "MIT"

[[bin]]
name = "dnd-table"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "mysql", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
regex = "1"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
futures = "0.3"
async-trait = "0.1"
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
