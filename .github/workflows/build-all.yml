name: Build all platforms

# Ручной запуск: собирает бинарники Windows/Linux/macOS и складывает их в артефакты.
# Его вызывает scripts/build.ps1 (gh workflow run), чтобы сложить все три платформы в dist/.
# Релиз не публикует — для этого release.yml по тегу vX.Y.Z.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dnd-table-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dnd-table-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: dnd-table-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}
      # Имена артефактов совпадают с release.yml: скрипт сборки ищет их по имени.
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bin="target/${{ matrix.target }}/release/dnd-table"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          cp "$bin" "out/${{ matrix.asset }}"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
