services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dnd
      MYSQL_USER: dnd
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dnd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_allowed_packet=256M
    volumes:
      - dnd_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dnd", "-p${MYSQL_PASSWORD:-dnd}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: amperverser/dnd-table:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    # Настройки: том dnd_data -> /app/data/config.yml (создаётся при первом запуске,
    # править: docker compose exec app vi /app/data/config.yml или через docker cp).
    # Переменные ниже перекрывают config.yml; пустые значения не учитываются.
    volumes:
      - dnd_data:/app/data
    environment:
      DATABASE_URL: mysql://dnd:${MYSQL_PASSWORD:-dnd}@db:3306/dnd
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEV_SHOW_CODE: ${DEV_SHOW_CODE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      ROOT_EMAIL: ${ROOT_EMAIL:-}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}

volumes:
  dnd_mysql:
  dnd_data:
